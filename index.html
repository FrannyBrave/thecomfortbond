      "name": "Will these work for residents with dementia or memory loss?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Every activity is designed with cognitive accessibility in mind. There are no wrong answers — just warm conversations, familiar music, and prompts that meet each person where they are."
      }
    },
    {
      "@type": "Question",
      "name": "How many sessions can I get out of one kit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each kit includes 6 different activity types. Most Activity Directors rotate through one activity type per session, getting 6+ sessions from a single kit. All 5 kits together give you 30+ sessions across every theme."
      }
    },
    {
      "@type": "Question",
      "name": "Is this a monthly subscription?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Every engagement kit is a one-time purchase. There are no hidden fees or recurring charges. Once you buy a kit, it's yours to print and use forever."
      }
    },
    {
      "@type": "Question",
      "name": "Can I print these for my whole floor?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes! The kits are specifically designed to be printer-friendly on standard 8.5\" x 11\" paper. Print as many copies as you need and hand them out directly to residents. One purchase covers your entire community."
      }
    },
    {
      "@type": "Question",
      "name": "How quickly will I get access?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Instantly. As soon as checkout is complete, you'll receive an email with a download link. You can purchase a kit and be running an activity with your group five minutes later."
      }
    }
  ]
}
</script>
