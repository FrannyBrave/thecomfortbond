    <!-- ✅ FIX 1C: FAQ Schema (NEW — enables Google rich results) -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is included in each engagement kit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each kit includes 5 activity modules: BINGO, Trivia, Word Link, Conversation Cards, and a Music Engagement guide — all themed around a specific topic like road trips, nostalgia, or holiday traditions."
      }
    },
    {
      "@type": "Question",
      "name": "How do I receive my purchase after buying?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "All kits are instant digital downloads. After purchase, you receive a download link by email immediately. No shipping, no waiting."
      }
    },
    {
      "@type": "Question",
      "name": "Are these kits suitable for memory care residents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The Comfort Bond kits are specifically designed for senior living communities including memory care facilities. Activities are gentle, familiar, and built to spark joy and connection."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need special training to facilitate these activities?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No prior experience is needed. Each kit is ready to use out of the box. Activity Directors, family caregivers, and volunteers can all facilitate these sessions with ease."
      }
    },
    {
      "@type": "Question",
      "name": "How many residents can participate in one kit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Kits are designed for group use — ideal for small groups of 4-8 residents or larger groups of 20+. There are no per-person limits."
      }
    }
  ]
}
