    <!-- ✅ FIX 1C: FAQ Schema (NEW — enables Google rich results) -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is this a monthly subscription?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. All of our engagement kits and the Full Ecosystem Bundle are one-time purchases. There are no hidden fees or recurring charges. Once you buy a kit, it's yours to use forever."
      }
    },
    {
      "@type": "Question",
      "name": "What file format will I receive?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Your kits are delivered as high-quality PDF files. The formatting, text size, and images look perfect on any computer or device."
      }
    },
    {
      "@type": "Question",
      "name": "Can I print these materials?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes! The kits are specifically designed to be printer-friendly on standard 8.5\" x 11\" paper. You can print BINGO cards, Trivia sheets, and Conversation prompts to hand out directly to residents."
      }
    },
    {
      "@type": "Question",
      "name": "Are these kits reusable?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Because these are digital downloads, you can print the materials as many times as you need. You can revisit the activities year after year."
      }
    },
    {
      "@type": "Question",
      "name": "How quickly will I get access?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Instantly. As soon as checkout is complete, you'll receive an email with a download link. You can purchase a kit and be playing with your group five minutes later."
      }
    }
  ]
}
</script>
